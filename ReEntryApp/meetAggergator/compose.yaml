services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: recovery
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - meeting_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d recovery"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  meeting_database:
