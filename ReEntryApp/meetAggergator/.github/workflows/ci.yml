name: Verify MVP foundation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: recovery
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: recovery_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U recovery -d recovery_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://recovery:ci_test_only@localhost:5432/recovery_test
      TEST_DATABASE_URL: postgres://recovery:ci_test_only@localhost:5432/recovery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint --workspace @recovery/client
      - run: npm test
      - run: npm run build
